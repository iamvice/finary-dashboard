name: probe

# Answers one question before anything is built on top of it: does a GitHub
# runner reach Finary, or does Cloudflare treat its address differently from the
# ones already measured?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where this runner is
        run: curl -s --max-time 15 https://api.ipify.org; echo

      - name: Reach Finary
        run: |
          for url in https://api.finary.com/users/me https://clerk.finary.com/v1/client; do
            echo "--- $url"
            curl -s -o /dev/null --max-time 20 -w "status=%{http_code}\n" "$url"
            curl -s -D - -o /dev/null --max-time 20 "$url" | grep -iE '^(server|cf-mitigated|cf-ray):' || true
            echo "body (first 200 chars):"
            curl -s --max-time 20 "$url" | head -c 200; echo
          done
