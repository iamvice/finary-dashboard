<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patrimoine</title>
<style>
  :root {
    --bg: #fbfaf9;
    --surface: #ffffff;
    --border: #e5e1dc;
    --text: #1c1a17;
    --muted: #6b6560;
    --accent: #b04a2f;
    --positive: #2f6b4a;
    --negative: #a33a2a;
    --bar: #d9d3cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #201e1b;
      --border: #35322e;
      --text: #f0ece7;
      --muted: #a09a93;
      --accent: #e0785a;
      --positive: #6fb894;
      --negative: #e08272;
      --bar: #3a3632;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  /* Lock screen */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
  #lock form {
    width: 100%; max-width: 24rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 2rem;
  }
  #lock h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
  #lock p { margin: 0 0 1.5rem; color: var(--muted); font-size: .875rem; }
  input[type=password] {
    width: 100%; padding: .7rem .85rem; font-size: 1rem; font-family: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: .75rem; padding: .7rem 1rem; font-size: 1rem; font-family: inherit;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error { margin-top: .85rem; color: var(--negative); font-size: .875rem; }

  /* Dashboard */
  header { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline; margin-bottom: 2rem; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .stamp { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .total { font-size: clamp(2rem, 7vw, 3rem); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: .25rem; }
  section { margin-top: 2.5rem; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 .85rem; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: .25rem 1rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .name { font-size: .95rem; }
  .val { font-variant-numeric: tabular-nums; text-align: right; }
  .pct { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .track { grid-column: 1 / -1; height: 4px; background: var(--bar); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .pos { color: var(--positive); }
  .neg { color: var(--negative); }
  .empty { color: var(--muted); font-size: .9rem; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>

<div id="lock">
  <form id="unlock-form">
    <h1>Patrimoine</h1>
    <p id="lock-sub">Saisis ta phrase secrète pour déchiffrer.</p>
    <input type="password" id="pass" autocomplete="current-password" autofocus
           placeholder="Phrase secrète" aria-label="Phrase secrète">
    <button type="submit" id="go">Déchiffrer</button>
    <div class="error" id="err" hidden></div>
  </form>
</div>

<div class="wrap" id="app" hidden></div>

<script>
const $ = (id) => document.getElementById(id);

const eur = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const pct = (n) => `${n >= 0 ? '' : '−'}${Math.abs(n).toFixed(1).replace('.', ',')} %`;

// The export mirrors Finary's own payloads, whose casing is not consistent
// between endpoints. Reading through a few spellings costs nothing and avoids a
// dashboard that silently renders blanks.
function pick(obj, ...names) {
  if (!obj) return undefined;
  for (const n of names) {
    if (obj[n] !== undefined && obj[n] !== null) return obj[n];
    const camel = n.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
    if (obj[camel] !== undefined && obj[camel] !== null) return obj[camel];
    const snake = n.replace(/[A-Z]/g, (c) => '_' + c.toLowerCase());
    if (obj[snake] !== undefined && obj[snake] !== null) return obj[snake];
  }
  return undefined;
}

const LABELS = {
  checking_accounts: 'Comptes courants',
  savings_accounts: 'Livrets',
  investment_accounts: 'Comptes-titres et PEA',
  cryptos: 'Crypto',
  fonds_euro: 'Fonds euros',
  commodities: 'Métaux précieux',
  crowdlendings: 'Crowdlending',
  real_estates: 'Immobilier',
  startups: 'Startups',
  other_assets: 'Autres actifs',
  loans: 'Crédits'
};

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(blob, passphrase) {
  const { kdf, cipher, data } = blob;
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(kdf.salt), iterations: kdf.iterations, hash: kdf.hash },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  // A wrong passphrase fails the GCM tag here rather than yielding garbage.
  const plain = await crypto.subtle.decrypt(
    { name: cipher.name, iv: b64(cipher.iv) }, key, b64(data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function bars(entries, total) {
  if (!entries.length) return '<p class="empty">Rien à afficher.</p>';
  return entries.map(([name, amount, share]) => {
    const width = Math.max(0, Math.min(100, share ?? (total ? amount / total * 100 : 0)));
    return `<div class="row">
      <span class="name">${name}</span>
      <span class="val">${eur.format(amount)} <span class="pct">${width.toFixed(1).replace('.', ',')} %</span></span>
      <div class="track"><div class="fill" style="width:${width}%"></div></div>
    </div>`;
  }).join('');
}

function render(payload) {
  const gross = pick(payload.portfolio, 'gross') ?? {};
  const assets = pick(gross, 'assets') ?? {};
  const liabilities = pick(gross, 'liabilities') ?? {};
  const totalNode = pick(gross, 'total') ?? {};
  const total = pick(totalNode, 'amount') ?? 0;
  const evolution = pick(totalNode, 'evolutionPercent', 'evolution_percent');

  const categories = Object.entries(assets)
    .map(([key, v]) => [LABELS[key] ?? key, pick(v, 'amount') ?? 0, pick(v, 'share')])
    .filter(([, amount]) => Math.abs(amount) > 0.5)
    .sort((a, b) => b[1] - a[1]);

  const debts = Object.entries(liabilities)
    .map(([key, v]) => [LABELS[key] ?? key, pick(v, 'amount') ?? 0, null])
    .filter(([, amount]) => Math.abs(amount) > 0.5);

  const debtTotal = debts.reduce((sum, [, a]) => sum + a, 0);

  const allocation = (node) => {
    const list = pick(node, 'distribution') ?? [];
    const nodeTotal = pick(node, 'total') ?? 0;
    return list
      .map((d) => [pick(d, 'label') ?? '?', pick(d, 'amount') ?? 0, pick(d, 'share')])
      .filter(([, a]) => Math.abs(a) > 0.5)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 12)
      .map(([l, a, s]) => [l, a, s ?? (nodeTotal ? a / nodeTotal * 100 : 0)]);
  };

  const stamp = payload.generatedAt
    ? new Date(payload.generatedAt).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })
    : 'date inconnue';

  const evolutionHtml = evolution === undefined ? '' :
    ` · <span class="${evolution >= 0 ? 'pos' : 'neg'}">${pct(evolution)}</span> depuis l'origine`;

  $('app').innerHTML = `
    <header>
      <h1>Patrimoine</h1>
      <span class="stamp">Relevé du ${stamp}</span>
    </header>

    <div class="total">${eur.format(total)}</div>
    <div class="sub">Actifs bruts${evolutionHtml}</div>
    ${debtTotal ? `<div class="sub">Dettes ${eur.format(debtTotal)} — net ${eur.format(total - debtTotal)}</div>` : ''}

    <section>
      <h2>Répartition par catégorie</h2>
      ${bars(categories, total)}
    </section>

    <section>
      <h2>Zone géographique <span class="pct">(poche actions)</span></h2>
      <div class="scroll">${bars(allocation(payload.geographic), 0)}</div>
    </section>

    <section>
      <h2>Secteurs <span class="pct">(poche actions)</span></h2>
      <div class="scroll">${bars(allocation(payload.sector), 0)}</div>
    </section>
  `;

  $('lock').hidden = true;
  $('app').hidden = false;
  document.title = `${eur.format(total)} — Patrimoine`;
}

let blob = null;

fetch('data.json', { cache: 'no-store' })
  .then((r) => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
  .then((b) => {
    blob = b;
    if (b.encryptedAt) {
      const when = new Date(b.encryptedAt).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' });
      $('lock-sub').textContent = `Données chiffrées du ${when}.`;
    }
  })
  .catch((e) => {
    $('err').hidden = false;
    $('err').textContent = `Données introuvables (${e.message}). Le robot n'a peut-être pas encore publié.`;
  });

$('unlock-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!blob) return;

  const button = $('go');
  $('err').hidden = true;
  button.disabled = true;
  // The KDF is deliberately slow; without this the page looks frozen.
  button.textContent = 'Déchiffrement…';

  try {
    render(await decrypt(blob, $('pass').value));
  } catch {
    $('err').hidden = false;
    $('err').textContent = 'Phrase secrète incorrecte.';
    $('pass').select();
  } finally {
    button.disabled = false;
    button.textContent = 'Déchiffrer';
  }
});
</script>
</body>
</html>
