<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Patrimoine</title>
<style>
  :root {
    --bg: #fbfaf9;
    --surface: #ffffff;
    --border: #e5e1dc;
    --text: #1c1a17;
    --muted: #6b6560;
    --accent: #b04a2f;
    --accent-soft: #b04a2f26;
    --positive: #2f6b4a;
    --negative: #a33a2a;
    --bar: #ddd7d0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --surface: #201e1b;
      --border: #35322e;
      --text: #f0ece7;
      --muted: #a09a93;
      --accent: #e0785a;
      --accent-soft: #e0785a30;
      --positive: #6fb894;
      --negative: #e08272;
      --bar: #3a3632;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  #lock { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
  #lock form {
    width: 100%; max-width: 24rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 2rem;
  }
  #lock h1 { margin: 0 0 .25rem; font-size: 1.25rem; }
  #lock p { margin: 0 0 1.5rem; color: var(--muted); font-size: .875rem; }
  input[type=password] {
    width: 100%; padding: .7rem .85rem; font-size: 1rem; font-family: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: .75rem; padding: .7rem 1rem; font-size: 1rem;
    font-family: inherit; background: var(--accent); color: #fff;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error { margin-top: .85rem; color: var(--negative); font-size: .875rem; }

  header { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline; margin-bottom: 1.75rem; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .stamp { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .total { font-size: clamp(2rem, 7vw, 3rem); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: .25rem; }

  section { margin-top: 2.75rem; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 .9rem; font-weight: 600; }
  h2 span { text-transform: none; letter-spacing: 0; }

  .row { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .name { font-size: .95rem; }
  .meta { display: block; color: var(--muted); font-size: .78rem; }
  .val { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .pct { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .track { grid-column: 1 / -1; height: 4px; background: var(--bar); border-radius: 2px; overflow: hidden; margin-top: .15rem; }
  .fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .pos { color: var(--positive); }
  .neg { color: var(--negative); }
  .empty { color: var(--muted); font-size: .9rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1rem; }
  .card .k { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
  .card .v { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: .2rem; }

  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; padding: 0 .6rem .5rem 0; }
  td { padding: .55rem .6rem .55rem 0; border-top: 1px solid var(--border); vertical-align: baseline; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 0; }
  .scroll { overflow-x: auto; }
  .tag { display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3rem; margin-left: .35rem; }

  .chart { width: 100%; height: 200px; display: block; }
  .chart .area { fill: var(--accent-soft); }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .chart .axis { stroke: var(--border); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<div id="lock">
  <form id="unlock-form">
    <h1>Patrimoine</h1>
    <p id="lock-sub">Saisis ta phrase secrète pour déchiffrer.</p>
    <input type="password" id="pass" autocomplete="current-password" autofocus
           placeholder="Phrase secrète" aria-label="Phrase secrète">
    <button type="submit" id="go">Déchiffrer</button>
    <div class="error" id="err" hidden></div>
  </form>
</div>

<div class="wrap" id="app" hidden></div>

<script>
const $ = (id) => document.getElementById(id);

const eur  = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const eur2 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num  = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 4 });
const pct  = (n) => `${n >= 0 ? '+' : '−'}${Math.abs(n).toFixed(1).replace('.', ',')} %`;

// The payload mirrors Finary's own responses, whose casing is not consistent:
// the top-level totals are camelCase, the per-category entries snake_case.
// Reading through both spellings costs nothing and avoids silent blanks.
function pick(obj, ...names) {
  if (!obj) return undefined;
  for (const n of names) {
    if (obj[n] !== undefined && obj[n] !== null) return obj[n];
    const camel = n.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
    if (obj[camel] !== undefined && obj[camel] !== null) return obj[camel];
    const snake = n.replace(/[A-Z]/g, (c) => '_' + c.toLowerCase());
    if (obj[snake] !== undefined && obj[snake] !== null) return obj[snake];
  }
  return undefined;
}

const CATEGORIES = {
  checking_accounts: 'Comptes courants', savings_accounts: 'Livrets',
  investment_accounts: 'Comptes-titres et PEA', cryptos: 'Crypto',
  fonds_euro: 'Fonds euros', commodities: 'Métaux précieux',
  crowdlendings: 'Crowdlending', real_estates: 'Immobilier',
  startups: 'Startups', other_assets: 'Autres actifs', loans: 'Crédits'
};

const GROUPS = {
  Checkings: 'Comptes courants', Savings: 'Livrets', Investments: 'Comptes-titres et PEA',
  Cryptos: 'Crypto', FondsEuro: 'Fonds euros', Commodities: 'Métaux précieux',
  RealEstates: 'Immobilier', Credits: 'Crédits', OtherAssets: 'Autres actifs',
  Startups: 'Startups'
};

const TYPES = { equity: 'Action', etf: 'ETF', fund: 'Fonds' };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(blob, passphrase) {
  const { kdf, cipher, data } = blob;
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(kdf.salt), iterations: kdf.iterations, hash: kdf.hash },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  // A wrong passphrase fails the GCM tag here rather than yielding garbage.
  const plain = await crypto.subtle.decrypt(
    { name: cipher.name, iv: b64(cipher.iv) }, key, b64(data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function bars(entries) {
  if (!entries.length) return '<p class="empty">Rien à afficher.</p>';
  const max = Math.max(...entries.map(([, , s]) => s ?? 0), 1);
  return entries.map(([label, amount, share, extra]) => `
    <div class="row">
      <span class="name">${esc(label)}${extra ? `<span class="meta">${esc(extra)}</span>` : ''}</span>
      <span class="val">${eur.format(amount)} <span class="pct">${(share ?? 0).toFixed(1).replace('.', ',')} %</span></span>
      <div class="track"><div class="fill" style="width:${((share ?? 0) / max * 100).toFixed(2)}%"></div></div>
    </div>`).join('');
}

// A plain area chart. 291 points over a year, so no interaction and no library:
// the shape is the whole message.
function chart(points) {
  if (points.length < 2) return '<p class="empty">Pas assez d\'historique.</p>';

  const W = 900, H = 200, padY = 14, padX = 4;
  const values = points.map((p) => p[1]);
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;

  const x = (i) => padX + i * (W - padX * 2) / (points.length - 1);
  const y = (v) => padY + (1 - (v - min) / span) * (H - padY * 2);

  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const area = `${line}L${x(points.length - 1).toFixed(1)},${H}L${x(0).toFixed(1)},${H}Z`;

  const first = new Date(points[0][0]).toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' });
  const last = new Date(points[points.length - 1][0]).toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' });

  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="Évolution du patrimoine sur un an">
      <path class="area" d="${area}"/>
      <path class="line" d="${line}"/>
    </svg>
    <div class="row" style="border:0;padding-top:.3rem">
      <span class="pct">${first} · ${eur.format(min)} au plus bas</span>
      <span class="pct">${last} · ${eur.format(max)} au plus haut</span>
    </div>`;
}

function accountsSection(accounts) {
  const groups = Object.entries(accounts ?? {})
    .map(([key, list]) => [GROUPS[key] ?? key, list])
    .filter(([, list]) => Array.isArray(list) && list.length)
    .sort((a, b) => sum(b[1]) - sum(a[1]));

  if (!groups.length) return '<p class="empty">Aucun compte.</p>';

  return groups.map(([label, list]) => `
    <div style="margin-bottom:1.5rem">
      <div class="row" style="border-bottom-width:2px">
        <span class="name"><strong>${esc(label)}</strong></span>
        <span class="val"><strong>${eur.format(sum(list))}</strong></span>
      </div>
      ${[...list].sort((a, b) => (pick(b, 'balance') ?? 0) - (pick(a, 'balance') ?? 0)).map((a) => {
        const pnl = pick(a, 'unrealizedPnl');
        return `<div class="row">
          <span class="name">${esc(pick(a, 'name') ?? '—')}
            <span class="meta">${esc(pick(pick(a, 'institution'), 'name') ?? '')}${
              pick(pick(a, 'bankAccountType'), 'displayName')
                ? ' · ' + esc(pick(pick(a, 'bankAccountType'), 'displayName')) : ''}</span>
          </span>
          <span class="val">${eur.format(pick(a, 'balance') ?? 0)}${
            pnl ? ` <span class="pct ${pnl >= 0 ? 'pos' : 'neg'}">${pnl >= 0 ? '+' : '−'}${eur.format(Math.abs(pnl))}</span>` : ''}</span>
        </div>`;
      }).join('')}
    </div>`).join('');
}

const sum = (list) => list.reduce((t, a) => t + (pick(a, 'balance') ?? 0), 0);

function positionsSection(accounts) {
  const rows = [];
  for (const list of Object.values(accounts ?? {})) {
    if (!Array.isArray(list)) continue;
    for (const account of list) {
      for (const holding of pick(account, 'securities') ?? []) {
        const s = pick(holding, 'security') ?? {};
        rows.push({
          name: pick(s, 'name') ?? '—',
          isin: pick(s, 'isin') ?? '',
          type: TYPES[pick(s, 'securityType')] ?? pick(s, 'securityType') ?? '',
          account: pick(account, 'name') ?? '',
          quantity: pick(holding, 'quantity') ?? 0,
          value: pick(holding, 'currentValue') ?? 0,
          pnl: pick(holding, 'unrealizedPnl') ?? 0,
          pnlPercent: pick(holding, 'unrealizedPnlPercent') ?? 0
        });
      }
    }
  }

  if (!rows.length) return '<p class="empty">Aucune ligne.</p>';
  rows.sort((a, b) => b.value - a.value);

  return `<div class="scroll"><table>
    <thead><tr>
      <th>Ligne</th><th class="num">Qté</th><th class="num">Valeur</th><th class="num">+/−</th>
    </tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td>${esc(r.name)}${r.type ? `<span class="tag">${esc(r.type)}</span>` : ''}
        <span class="meta">${esc(r.account)}${r.isin ? ' · ' + esc(r.isin) : ''}</span></td>
      <td class="num">${num.format(r.quantity)}</td>
      <td class="num">${eur.format(r.value)}</td>
      <td class="num ${r.pnl >= 0 ? 'pos' : 'neg'}">${r.pnl >= 0 ? '+' : '−'}${eur.format(Math.abs(r.pnl))}
        <span class="meta ${r.pnl >= 0 ? 'pos' : 'neg'}">${pct(r.pnlPercent)}</span></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function allocation(node) {
  const list = pick(node, 'distribution') ?? [];
  const total = pick(node, 'total') ?? 0;
  return list
    .map((d) => [pick(d, 'label') ?? '?', pick(d, 'amount') ?? 0, pick(d, 'share')])
    .filter(([, a]) => Math.abs(a) > 0.5)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 12)
    .map(([l, a, s]) => [l, a, s ?? (total ? a / total * 100 : 0)]);
}

function render(payload) {
  const gross = pick(payload.portfolio, 'gross') ?? {};
  const assets = pick(gross, 'assets') ?? {};
  const totalNode = pick(gross, 'total') ?? {};
  const total = pick(totalNode, 'amount') ?? 0;
  const evolution = pick(totalNode, 'evolutionPercent');
  const debt = pick(pick(pick(gross, 'liabilities'), 'loans'), 'amount') ?? 0;

  const categories = Object.entries(assets)
    .map(([key, v]) => [CATEGORIES[key] ?? key, pick(v, 'amount') ?? 0, pick(v, 'share')])
    .filter(([, amount]) => Math.abs(amount) > 0.5)
    .sort((a, b) => b[1] - a[1]);

  const series = pick(payload.timeseries?.[0], 'timeseries') ?? [];
  const dividends = payload.dividends ?? {};
  const fees = pick(payload.fees, 'total') ?? {};

  const stamp = payload.generatedAt
    ? new Date(payload.generatedAt).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' })
    : 'date inconnue';

  $('app').innerHTML = `
    <header>
      <h1>Patrimoine</h1>
      <span class="stamp">Relevé du ${stamp}</span>
    </header>

    <div class="total">${eur.format(total)}</div>
    <div class="sub">Actifs bruts${evolution === undefined ? '' :
      ` · <span class="${evolution >= 0 ? 'pos' : 'neg'}">${pct(evolution)}</span> depuis l'origine`}</div>
    ${debt ? `<div class="sub">Dettes ${eur.format(debt)} — net ${eur.format(total - debt)}</div>` : ''}

    <section>
      <h2>Évolution <span>sur un an</span></h2>
      ${chart(series)}
    </section>

    <section>
      <h2>Répartition par catégorie</h2>
      ${bars(categories)}
    </section>

    <section>
      <h2>Comptes</h2>
      ${accountsSection(payload.accounts)}
    </section>

    <section>
      <h2>Lignes détenues</h2>
      ${positionsSection(payload.accounts)}
    </section>

    <section>
      <h2>Zone géographique <span>(poche actions)</span></h2>
      ${bars(allocation(payload.geographic))}
    </section>

    <section>
      <h2>Secteurs <span>(poche actions)</span></h2>
      ${bars(allocation(payload.sector))}
    </section>

    <section>
      <h2>Revenus et frais</h2>
      <div class="cards">
        <div class="card"><div class="k">Dividendes / an</div>
          <div class="v">${eur2.format(pick(dividends, 'annualIncome') ?? 0)}</div></div>
        <div class="card"><div class="k">Rendement</div>
          <!-- Already a percentage, like every other percent in this payload.
               Scaling it by 100 turned 0.67 % into a headline 67 %. -->
          <div class="v">${(pick(dividends, 'yield') ?? 0).toFixed(2).replace('.', ',')} %</div></div>
        <div class="card"><div class="k">Frais / an</div>
          <div class="v">${eur2.format(pick(fees, 'annualFeesAmount') ?? 0)}</div></div>
        <div class="card"><div class="k">Frais cumulés</div>
          <div class="v">${eur2.format(pick(fees, 'cumulatedFeesAmount') ?? 0)}</div></div>
      </div>
    </section>
  `;

  $('lock').hidden = true;
  $('app').hidden = false;
  document.title = `${eur.format(total)} — Patrimoine`;
}

let blob = null;

fetch('data.json', { cache: 'no-store' })
  .then((r) => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
  .then((b) => {
    blob = b;
    if (b.encryptedAt) {
      const when = new Date(b.encryptedAt).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' });
      $('lock-sub').textContent = `Données chiffrées du ${when}.`;
    }
  })
  .catch((e) => {
    $('err').hidden = false;
    $('err').textContent = `Données introuvables (${e.message}). Le robot n'a peut-être pas encore publié.`;
  });

$('unlock-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!blob) return;

  const button = $('go');
  $('err').hidden = true;
  button.disabled = true;
  // The KDF is deliberately slow; without this the page looks frozen.
  button.textContent = 'Déchiffrement…';

  try {
    render(await decrypt(blob, $('pass').value));
  } catch (e) {
    $('err').hidden = false;
    $('err').textContent = 'Phrase secrète incorrecte.';
    $('pass').select();
  } finally {
    button.disabled = false;
    button.textContent = 'Déchiffrer';
  }
});
</script>
</body>
</html>
